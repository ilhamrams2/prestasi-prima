name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, gd, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM & Build Assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync Files to Server (Rsync)
        run: |
          # Mengirim file yang sudah jadi (termasuk folder vendor & public/build)
          # Mengatasi masalah "Risiko Error" karena file tertinggal
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage/*.key' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.APP_PATH }}/

      - name: Run Production Commands on Server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh $SERVER_USER@$SERVER_IP << 'ENDSSH'
            set -e
            cd ${{ secrets.APP_PATH }}
            
            # --- PROTEKSI KEMUNGKINAN ERROR ---
            
            # 1. Deteksi Path PHP & Composer (Atasi "Command Not Found")
            PHP_EXEC=$(which php8.3 || which php83 || which php)
            echo "✅ Using PHP: $PHP_EXEC"
            
            # 2. Paksa sinkronisasi dengan Git (Atasi "Git Conflict")
            # Meskipun sudah di-rsync, kita pastikan folder storage & cache aman
            mkdir -p storage/framework/{sessions,views,cache}
            chmod -R 775 storage bootstrap/cache
            
            # 3. Jalankan Migrasi dengan Force (Atasi "Lupa Perintah")
            # Menggunakan PHP_EXEC yang sudah dideteksi di langkah 1
            $PHP_EXEC artisan down || true
            
            echo "🗄️ Running migrations..."
            $PHP_EXEC artisan migrate --force
            
            echo "⚡ Optimizing Cache..."
            $PHP_EXEC artisan config:cache
            $PHP_EXEC artisan route:cache
            $PHP_EXEC artisan view:cache
            
            $PHP_EXEC artisan up
            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: Health Check
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.APP_URL }})
          if [ $HTTP_CODE -eq 200 ] || [ $HTTP_CODE -eq 302 ]; then
            echo "✅ Application is alive (HTTP $HTTP_CODE)"
          else
            echo "❌ Application returned HTTP $HTTP_CODE - Check Logs!"
            exit 1
          fi
